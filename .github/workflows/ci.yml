name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build check - verify required files exist
        run: |
          test -f index.html
          test -f style.css
          test -f logic.js
          test -f app.js
          echo "Build check passed: all required files present."

      - name: Syntax check JavaScript files
        run: |
          node --check logic.js
          node --check app.js
          echo "Syntax check passed."

      - name: Run unit tests
        run: node --test tests/